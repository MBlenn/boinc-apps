name: build-app-images

# Builds the container images of the apps in this repository and pushes them to GHCR.
# The images build on ghcr.io/<owner>/boinc-app-base:trixie from boinc-stack.
# - on changes under app-images/ or apps/ on main
# - manually
on:
  push:
    branches: [main]
    paths: ["app-images/**", "apps/**", ".github/workflows/build-app-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gnina:
    runs-on: ubuntu-latest
    env:
      GNINA_VERSION: "1.3.3"
    steps:
      # the gnina binary is 2 GB, the CUDA libraries add about 2 GB
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Parameters
        id: p
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/boinc-app-gnina" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/${owner}/boinc-app-base:trixie" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app-images/gnina
          file: app-images/gnina/Containerfile
          pull: true
          push: true
          build-args: |
            BASE=${{ steps.p.outputs.base }}
            GNINA_VERSION=${{ env.GNINA_VERSION }}
          tags: |
            ${{ steps.p.outputs.image }}:${{ env.GNINA_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Smoke test without GPU: redock 184L on the CPU and validate the result
      - name: Test (CPU redocking + validator)
        run: |
          td=apps/gnina/testdata
          docker run --rm -v "$PWD/$td:/data:ro" -v "$RUNNER_TEMP:/out" \
            ${{ steps.p.outputs.image }}:${{ env.GNINA_VERSION }} \
            gnina --no_gpu -r /data/184l_rec.pdb -l /data/184l_lig.sdf \
              --autobox_ligand /data/184l_lig.sdf --seed 1 --num_modes 9 -o /out/docked.sdf
          GNINA_TESTDATA="$td" python3 apps/gnina/server/gnina_validate.py \
            --wu gnina_redock_184l_184l_ci_0 "$RUNNER_TEMP/docked.sdf"

      # Job generator: every kind of job references existing test data
      - name: Test (jobs.py)
        run: |
          python3 - <<'PY'
          import importlib.util, os, random
          spec = importlib.util.spec_from_file_location("jobs", "apps/gnina/jobs.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          td = "apps/gnina/testdata"
          jobs = m.make_jobs(200, random.Random(1), "ci", td)
          assert len(jobs) == 200
          for j in jobs:
              for f in j["inputs"]:
                  assert os.path.isfile(os.path.join(td, f)), f
          print(sorted({j["name"].split("_")[1] for j in jobs}))
          PY
